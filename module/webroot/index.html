<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Fastboot Studio Companion</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <img class="logo" src="logo.svg" alt="" width="40" height="40">
      <div class="who">
        <div class="title"><svg class="wm" viewBox="0 0 5248 1237" style="width:4.243em" role="img" aria-label="Companion"><path fill="currentColor" d="M350 903H345C235 903 202 863 223 713L241 587C261 438 308 396 409 396H414C473 396 504 403 567 442L636 366C567 306 502 285 430 285C239 285 151 360 117 598L103 702C71 930 146 1015 334 1015C410 1015 480 995 562 936L495 864C431 898 403 903 350 903ZM639 761C614 936 678 1012 838 1012C1011 1012 1073 950 1099 761L1118 629C1142 454 1078 378 918 378C752 378 683 447 657 629ZM761 758 779 632C795 518 817 489 903 489C991 489 1012 516 996 632L978 758C961 878 943 901 854 901C761 901 744 879 761 758ZM1173 1000H1294L1359 539C1394 501 1449 471 1505 471C1565 471 1574 506 1557 626L1505 1000H1616L1672 600C1675 581 1676 563 1678 540C1717 501 1773 471 1827 471C1887 471 1896 506 1879 626L1827 1000H1938L1994 600C2016 443 1983 378 1868 378C1822 378 1780 392 1748 408L1675 476C1663 412 1625 378 1546 378C1500 378 1458 392 1426 408L1370 461L1380 390H1258ZM2029 1225H2146L2187 936L2227 989C2255 1004 2290 1012 2345 1012C2454 1012 2530 945 2550 804L2581 584C2600 447 2537 378 2405 378C2356 378 2305 393 2260 416L2263 390H2146ZM2371 488C2446 488 2470 512 2459 584L2429 804C2419 875 2385 902 2320 902C2272 902 2225 880 2200 841L2236 584C2247 508 2276 488 2371 488ZM2653 804C2633 944 2694 1011 2840 1011C2873 1011 2916 1004 2947 989L2997 935L2988 1000H3104L3190 390H3085L3069 428C3028 395 2979 378 2926 378C2775 378 2704 437 2684 584ZM2774 804 2805 584C2815 513 2848 488 2929 488C3032 488 3056 508 3042 609L3009 841C2973 880 2919 902 2864 902C2790 902 2764 875 2774 804ZM3222 1000H3344L3408 534C3443 496 3500 471 3554 471C3614 471 3625 497 3607 628L3554 1000H3666L3722 602C3745 436 3709 378 3595 378C3548 378 3507 385 3468 402L3419 455L3429 390H3308ZM3821 764C3798 927 3824 1006 3947 1006C3960 1006 3971 1005 3986 1003L3998 905C3931 905 3926 886 3943 763L3995 390H3794L3782 474L3859 492ZM3886 274C3881 309 3906 338 3941 338C3978 338 4010 309 4015 274C4020 237 3996 209 3959 209C3924 209 3891 237 3886 274ZM4062 761C4037 936 4101 1012 4261 1012C4434 1012 4496 950 4522 761L4541 629C4565 454 4501 378 4341 378C4175 378 4106 447 4080 629ZM4184 758 4202 632C4218 518 4240 489 4326 489C4414 489 4435 516 4419 632L4401 758C4384 878 4366 901 4277 901C4184 901 4167 879 4184 758ZM4595 1000H4717L4781 534C4816 496 4873 471 4927 471C4987 471 4998 497 4980 628L4927 1000H5039L5095 602C5118 436 5082 378 4968 378C4921 378 4880 385 4841 402L4792 455L4802 390H4681Z"/></svg> <span class="chip warn" id="betaChip" hidden data-i="beta"></span></div>
        <div class="sub" id="whoLine">…</div>
      </div>
    </div>
    <div class="bar-end">
      <span class="chip" id="rootChip" hidden></span>
      <button class="iconbtn" id="themeBtn" type="button">
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Device -->
    <section class="view" id="v-device">
      <div id="blackbox"></div>
      <div class="card">
        <h3><span data-i="boot.title"></span><span class="chip" id="avbChip"></span></h3>
        <dl class="kv" id="bootKv"></dl>
        <p class="note warn" id="spoofNote" hidden data-i="boot.spoofed"></p>
      </div>
      <div class="card">
        <h3><span data-i="kernel.title"></span><span class="chip info" id="kmiChip" hidden>KMI</span></h3>
        <dl class="kv" id="kernelKv"></dl>
      </div>
      <div class="grid2" id="stats"></div>
      <div class="card wide">
        <h3><span data-i="cpu.title"></span><span class="chip mute" id="cpuTemp">–</span></h3>
        <div class="cores" id="cores"></div>
        <div class="legend"><span id="memLine">–</span><span id="swapLine"></span></div>
      </div>
    </section>

    <!-- Partitions -->
    <section class="view" id="v-parts" hidden>
      <div class="card" id="superCard" hidden>
        <h3><span>super</span><span class="chip mute" id="superFree"></span></h3>
        <div class="superbar" id="superBar"></div>
        <div class="slegend" id="superLegend"></div>
        <p class="note" id="superNote"></p>
      </div>
      <div class="row">
        <input class="search" id="partQ" type="search" autocomplete="off" spellcheck="false" data-ph="parts.search">
      </div>
      <div class="filters" id="partF" role="group">
        <button class="fbtn" data-f="all" aria-pressed="true" data-i="parts.all"></button>
        <button class="fbtn" data-f="critical" aria-pressed="false" data-i="cat.critical"></button>
        <button class="fbtn" data-f="boot" aria-pressed="false" data-i="cat.boot"></button>
        <button class="fbtn" data-f="other" aria-pressed="false" data-i="parts.rest"></button>
      </div>
      <div class="card flush"><table class="ptable"><tbody id="partRows"></tbody></table></div>
      <p class="note" id="partCount"></p>
    </section>

    <!-- Modules -->
    <section class="view" id="v-mods" hidden>
      <div class="card">
        <h3><span data-i="mods.title"></span><span class="chip mute" id="modsChip">…</span></h3>
        <p class="note" id="modsSummary"></p>
        <p class="note" data-i="mods.hint"></p>
        <button class="btn ghost" id="modsScan" data-i="mods.scan" style="margin-top:.8rem"></button>
      </div>
      <div class="mgrid" id="modsConflicts"></div>
      <div class="card">
        <h3 data-i="mods.list"></h3>
        <table class="ptable"><tbody id="modsRows"></tbody></table>
      </div>
    </section>

    <!-- Logs -->
    <section class="view" id="v-log" hidden>
      <div class="seg" role="group">
        <button id="srcKernel" aria-pressed="true" data-i="log.kernel"></button>
        <button id="srcApp" aria-pressed="false" data-i="log.app"></button>
      </div>
      <div class="row">
        <input class="search ltr" id="logQ" type="search" autocomplete="off" spellcheck="false" data-ph="log.search">
        <button class="btn-s" id="logPause" aria-pressed="false" data-i="log.pause"></button>
      </div>
      <div class="filters" id="logF" role="group">
        <button class="fbtn" data-l="all" aria-pressed="true" data-i="log.all"></button>
        <button class="fbtn" data-l="e" aria-pressed="false" data-i="log.errors"></button>
        <button class="fbtn" data-l="w" aria-pressed="false" data-i="log.warnings"></button>
        <button class="fbtn" data-l="s" aria-pressed="false">SELinux</button>
        <button class="fbtn rules" id="rulesBtn" data-i="log.rules"></button>
      </div>
      <div class="logbox" id="logBox"></div>
      <p class="note" data-i="log.tap"></p>
    </section>

    <!-- Backup -->
    <section class="view split" id="v-backup" hidden>
      <div class="stack">
      <label class="opt"><input type="radio" name="set" value="critical" checked><span><b data-i="set.critical"></b><small id="setCritical"></small></span></label>
      <label class="opt"><input type="radio" name="set" value="boot"><span><b data-i="set.boot"></b><small id="setBoot"></small></span></label>
      <label class="opt"><input type="radio" name="set" value="full"><span><b data-i="set.full"></b><small id="setFull"></small></span></label>
      <button class="btn" id="backupGo" data-i="backup.start"></button>
      <div class="card" id="progCard" hidden>
        <h3><span id="progTitle"></span><span class="chip mute" id="progCount"></span></h3>
        <div class="meter big"><i id="progBar"></i></div>
        <div class="prog" id="progRows"></div>
      </div>
      </div>
      <div class="stack">
      <div class="card">
        <h3><span data-i="backup.saved"></span><span class="chip mute ltr" id="backupRoot"></span></h3>
        <div class="blist" id="backupList"></div>
        <p class="note" data-i="backup.format"></p>
        <div class="links" data-links></div>
      </div>
      </div>
    </section>

    <!-- Tools -->
    <section class="view cols" id="v-tools" hidden>
      <div class="card">
        <h3><span data-i="reboot.title"></span><span class="chip warn" data-i="reboot.action"></span></h3>
        <div class="rgrid" id="rebootGrid"></div>
      </div>
      <div class="card">
        <h3 data-i="bundle.title"></h3>
        <p class="note" data-i="bundle.body"></p>
        <label class="check"><input type="checkbox" id="redact" checked> <span data-i="bundle.redact"></span></label>
        <button class="btn ghost" id="bundleGo" data-i="bundle.go"></button>
        <p class="note ltr" id="bundleOut"></p>
      </div>
      <div class="card">
        <h3 data-i="about.title"></h3>
        <p class="sig-row"><img class="sig sig-dark" src="ifoknr-dark.svg" alt="IFOKNR"><img class="sig sig-light" src="ifoknr-light.svg" alt="IFOKNR"></p>
        <dl class="kv" id="aboutKv"></dl>
        <div class="links" data-links></div>
      </div>
      <div class="card">
        <h3 data-i="theme.title"></h3>
        <div class="seg three" id="themeSeg" role="group">
          <button data-theme="auto" data-i="theme.auto"></button>
          <button data-theme="dark" data-i="theme.dark"></button>
          <button data-theme="light" data-i="theme.light"></button>
        </div>
        <h3 class="gap" data-i="lang.title"></h3>
        <div class="seg three" id="langSeg" role="group">
          <button data-lang="auto" data-i="lang.auto"></button>
          <button data-lang="ar">العربية</button>
          <button data-lang="en">English</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="nav" role="tablist">
    <button role="tab" data-v="device" aria-selected="true"><span class="ico"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/></svg></span><span data-i="tab.device"></span></button>
    <button role="tab" data-v="parts" aria-selected="false"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11"/></svg></span><span data-i="tab.parts"></span></button>
    <button role="tab" data-v="mods" aria-selected="false"><span class="ico"><svg viewBox="0 0 24 24"><path d="M9 3h6v3a1.5 1.5 0 0 0 3 0V3h3v6h-3a1.5 1.5 0 0 0 0 3h3v9h-6v-3a1.5 1.5 0 0 0-3 0v3H3v-6h3a1.5 1.5 0 0 0 0-3H3V3h6z"/></svg></span><span data-i="tab.mods"></span></button>
    <button role="tab" data-v="log" aria-selected="false"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 6l4 4-4 4M11 18h9"/></svg></span><span data-i="tab.log"></span></button>
    <button role="tab" data-v="backup" aria-selected="false"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg></span><span data-i="tab.backup"></span></button>
    <button role="tab" data-v="tools" aria-selected="false"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 7.5a8 8 0 1 0 11.4 0"/></svg></span><span data-i="tab.tools"></span></button>
  </nav>

  <div class="sheet" id="sheet" hidden>
    <div class="in" role="dialog" aria-modal="true">
      <h4 id="sheetTitle"></h4>
      <div id="sheetBody"></div>
      <div class="row2" id="sheetBtns"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>

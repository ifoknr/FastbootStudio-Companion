name: release

# Run from the Actions tab (or the API) with the version to publish, e.g. v2.3.0. It must
# match module.prop, bin/fbs, update.json and a "## vX.Y.Z" section in CHANGELOG.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (vX.Y.Z)
        required: true
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          prop=$(sed -n 's/^version=//p' module/module.prop)
          if [ "$prop" != "$RELEASE_VERSION" ]; then
            echo "module.prop says $prop, asked for $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Test
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mksh busybox jq zip
          SHELLS="dash mksh busybox-sh" sh tests/run.sh

      - name: Build
        run: sh tools/build.sh dist

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## $RELEASE_VERSION" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publish
        run: |
          zip=dist/FastbootStudio-Companion-$RELEASE_VERSION.zip
          pre=${{ inputs.prerelease }}
          # A beta build (FBS_CHANNEL=beta in bin/fbs) is always a pre-release.
          grep -q '^FBS_CHANNEL=beta$' module/bin/fbs && pre=true
          flag=
          [ "$pre" = true ] && flag=--prerelease
          gh release create "$RELEASE_VERSION" "$zip" \
            --target "$GITHUB_SHA" --title "Fastboot Studio Companion $RELEASE_VERSION" --notes-file notes.md $flag
          echo "FILE=$zip" >> "$GITHUB_ENV"
          echo "TAG=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "PRE=$pre" >> "$GITHUB_ENV"

      # The same post as Fastboot Studio's: the zip, the CHANGELOG section and link buttons.
      # Skipped without the secrets. A release made with GITHUB_TOKEN starts no other
      # workflow, so the post is sent from here.
      - name: Notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_TOPIC: ${{ secrets.TELEGRAM_TOPIC }}
          TOOL: FastbootStudioCompanion
          ICON: "🧩"
          LAYER: "مود روت رفيق لـ Fastboot Studio: فحص الجهاز والبارتشنات واللوق اللحظي والباك أب"
          REQUIRES: "Magisk أو KernelSU أو APatch (الواجهة في KernelSU و APatch و MMRL)"
          AUTO_UPDATE: "true"
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/telegram-release.sh
